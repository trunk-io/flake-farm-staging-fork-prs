name: Rust Tests

on:
  schedule:
    - cron: 0 */6 * * *
  pull_request: {}

jobs:
  rust_test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Build
        run: cargo build -q --all --manifest-path=./rust/Cargo.toml

      - name: Install nextest
        run: curl -LsSf https://get.nexte.st/latest/linux | tar zxf - -C ${CARGO_HOME:-~/.cargo}/bin

      - name: Install trunk-analytics-cli
        run: bash get-trunk-cli "1.0.0-beta.2"

      - name: Run rust tests
        id: run_tests
        if: ${{ always() }}
        run: cargo nextest run --profile=ci --manifest-path=./rust/Cargo.toml
        continue-on-error: true

      - name: Run rust tests and upload results
        env:
          TRUNK_PUBLIC_API_ADDRESS: "https://api.trunk-staging.io"
          TRUNK_ALLOW_FORKED_PR_UPLOADS: "true"
          TRUNK_API_TOKEN: ${{ secrets.TRUNK_STAGING_API_V2_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          ./trunk-analytics-cli test \
            --org-url-slug trunk-staging-org \
            --test-collection-id bxk8SdlO \
            --junit-paths "rust/**/nextest/ci/*junit.xml" \
            -- cargo nextest run --profile=ci --manifest-path=./rust/Cargo.toml

      - name: Upload JUnit XML artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-junit-results
          path: rust/**/nextest/ci/*junit.xml
          retention-days: 7
