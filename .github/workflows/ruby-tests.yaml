name: Ruby Tests

on:
  schedule:
    - cron: 0 */6 * * *
  pull_request: {}
  workflow_dispatch:
    inputs:
      rspec_trunk_flaky_tests_version:
        description: "Version of rspec_trunk_flaky_tests gem to use (e.g., 0.12.5)"
        required: false
        type: string

jobs:
  ruby_test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Override rspec_trunk_flaky_tests version
        if: ${{ inputs.rspec_trunk_flaky_tests_version }}
        run: |
          sed -i "s/gem 'rspec_trunk_flaky_tests'.*/gem 'rspec_trunk_flaky_tests', '${{ inputs.rspec_trunk_flaky_tests_version }}'/" Gemfile
          cat Gemfile

      - name: Set up Ruby
        uses: ruby/setup-ruby@20eb24b0d509e2b9ed9b6d42ddfeb992915e0564 # v1.341.0
        with:
          ruby-version: 3.4.9
          bundler-cache: ${{ !inputs.rspec_trunk_flaky_tests_version }}

      - name: Install dependencies with custom gem version
        if: ${{ inputs.rspec_trunk_flaky_tests_version }}
        run: bundle install

      - name: Optionally pin pre-release trunk rspec gem
        if: vars.RSPEC_PRE_RELEASE_TEST_VERSION != '' && vars.RSPEC_PRE_RELEASE_TEST_VERSION != 'latest'
        run: |
          VERSION='${{ vars.RSPEC_PRE_RELEASE_TEST_VERSION }}'
          sed -i "s/^gem 'rspec_trunk_flaky_tests'.*/gem 'rspec_trunk_flaky_tests', '= ${VERSION}'/" Gemfile
          bundle config set --local frozen false
          bundle install

      # this is the recommended way to run rspec tests using the trunk rspec plugin
      - name: Run rspec tests (with trunk rspec plugin)
        id: rspec_trunk_tests
        if: ${{ always() }}
        working-directory: ruby/trunk_rspec
        env:
          TRUNK_PUBLIC_API_ADDRESS: "https://api.trunk-staging.io"
          TRUNK_ORG_URL_SLUG: trunk-staging-org
          TRUNK_TEST_COLLECTION_ID: bxk8SdlO
          TRUNK_ALLOW_FORKED_PR_UPLOADS: "true"
        run: bundle exec rspec
        continue-on-error: true

      - name: Run rspec tests
        id: rspec_tests
        if: ${{ always() }}
        run: bundle exec rspec ruby/rspec --format RspecJunitFormatter --out rspec_test.xml
        continue-on-error: true

      - name: Process rspec results
        # Run this step even if the test step ahead fails
        if: ${{ always() }}
        uses: trunk-io/analytics-uploader@v2
        env:
          TRUNK_PUBLIC_API_ADDRESS: "https://api.trunk-staging.io"
        with:
          cli-version: 1.0.0-beta.2
          # Path to your test results.
          junit-paths: "**/rspec_test.xml"
          # Provide your Trunk organization slug.
          org-slug: trunk-staging-org
          token: ${{ secrets.TRUNK_STAGING_API_V2_TOKEN }}
          allow-forked-pr-uploads: true
          # Pass the test outcome for quarantining support
          previous-step-outcome: ${{ steps.rspec_tests.outcome }}
          test-collection-id: bxk8SdlO

      - name: Run minitest tests
        id: minitest_tests
        if: ${{ always() }}
        run: bundle exec ruby ruby/minitest/mixer.rb
        continue-on-error: true

      - name: Process minitest results
        # Run this step even if the test step ahead fails
        if: ${{ always() }}
        uses: trunk-io/analytics-uploader@v2
        env:
          TRUNK_PUBLIC_API_ADDRESS: "https://api.trunk-staging.io"
        with:
          cli-version: 1.0.0-beta.2
          # Path to your test results.
          junit-paths: "**/ruby/minitest/results/*.xml"
          # Provide your Trunk organization slug.
          org-slug: trunk-staging-org
          token: ${{ secrets.TRUNK_STAGING_API_V2_TOKEN }}
          allow-forked-pr-uploads: true
          # Pass the test outcome for quarantining support
          previous-step-outcome: ${{ steps.minitest_tests.outcome }}
          test-collection-id: bxk8SdlO

      - name: Upload JUnit XML artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ruby-junit-results
          path: |
            **/rspec_test.xml
            **/ruby/minitest/results/*.xml
          retention-days: 7
